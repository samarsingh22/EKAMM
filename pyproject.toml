[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework — perimeter network log ingest, normalization to OCSF, and ML-ready analytics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "python-dateutil",
    "regex",
    "orjson",
    "pyarrow",
    "pandas",
    "scikit-learn",
    "joblib",
    "duckdb",
    "drain3",
    "watchdog",
    "cryptography",
    "uuid6",
    "typer",
    "rich",
    "prometheus-client",
    "aiofiles",
    "httpx",
]

[project.optional-dependencies]
# Optional GeoIP enrichment. The GeoLite2 .mmdb data files are NOT bundled and
# NOT redistributable — see deploy/data/README.md.
geoip = ["maxminddb>=2.2"]
# Optional Kafka ingest buffer (ulpf/ingest/buffer/kafka_buffer.py). Not needed
# for the default settings.buffer.backend = "in_process".
kafka = ["aiokafka>=0.10,<1"]
# Optional: bench/replay.py's --server-pid peak-RSS sampling of the ULPF
# server process. Not needed to run bench/replay.py without --server-pid.
bench = ["psutil>=5.9"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "httpx",
    "aiokafka>=0.10,<1",  # so the buffer tests can exercise KafkaProducerBuffer/KafkaConsumerBuffer
    "psutil>=5.9",  # so the bench/replay.py tests can exercise --server-pid
    "ruff==0.16.5",  # pin exactly: keep in step with .pre-commit-config.yaml's `rev`
    "mypy",
    "pre-commit",
]

[project.scripts]
ulpf = "ulpf.cli.main:app"

[tool.setuptools.packages.find]
include = ["ulpf*"]

[tool.setuptools.package-data]
# Non-Python resources that must ship inside the installed package.
ulpf = ["parse/patterns/*.grok"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's dependency-injection idiom: `x: T = typer.Option(...)` in signatures.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
